# SwiftLint for the iOS app (LintConventionPlugin.kt: `./gradlew lintSwift`). swift-format (`.swift-format` beside this file) owns layout,
# so the rules that would argue with it are off here, as ktfmt owns Kotlin's and detekt its other rules. There is no baseline: fix a
# finding, or disable its rule on the one line with `// swiftlint:disable:next <rule>` and the reason (EditProfileView.swift).
excluded:
  - iosApp/Design/Generated

disabled_rules:
  # swift-format's.
  - closing_brace
  - colon
  - comma
  - indentation_width
  - leading_whitespace
  - line_length
  - opening_brace
  - closure_parameter_position
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace
  # SwiftUI's own idiom: Button(action:) { label }, Section(content:) { header }.
  - multiple_closures_with_trailing_closure
  # The app's names follow Kotlin's (one letter for a coordinate, `id`), and SwiftUI's views are long by nature.
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - todo

opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - weak_delegate

# `let _ = f()` is the only way to discard a result inside a view builder.
redundant_discardable_let:
  ignore_swiftui_view_bodies: true

custom_rules:
  # The Swift twin of the detekt rule NoSystemClockInUi: views read the time and time zone from the environment's ShownClock (`\.clock`),
  # so previews and snapshot tests can fix them.
  no_system_clock_in_views:
    name: No system clock in views
    regex: '\bDate\(\)|\bDate\.now\b|\bTimeZone\.(current|autoupdatingCurrent)\b'
    excluded:
      - iosApp/Text/ShownClock\.swift
      - iosAppTests/
    message: "Read the time and time zone from the environment's ShownClock (`@Environment(\\.clock)`), so previews and tests can fix them."
    severity: error
