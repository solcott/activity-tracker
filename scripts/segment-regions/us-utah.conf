# Region preset for scripts/segment-fetch.sh and scripts/segment-import.sh (segments/segment-import).
# GEOFABRIK: the extract's path under https://download.geofabrik.de/, without -latest.osm.pbf.
# BBOX: west south east north, in degrees; agency trails that touch it come in whole.
# AGENCIES: which of usfs, nps and blm cover the region. REGION_LANG: its two-letter language code.
GEOFABRIK=north-america/us/utah
BBOX="-114.06 36.99 -109.04 42.01"
AGENCIES="usfs nps blm"
REGION_LANG=en
