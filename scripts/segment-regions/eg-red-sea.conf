# Region preset for scripts/segment-fetch.sh and scripts/segment-import.sh: Egypt's Red Sea coast, for its dive sites
# (scripts/segment-import.sh eg-red-sea --sites-only). Keys as in us-utah.conf, plus:
# SITES_BBOX: west south east north, in degrees; --sites takes only the extract's dive sites inside it (Egypt's extract also holds the
# Mediterranean coast). It spans the Gulfs of Suez and Aqaba, Sinai, and the coast from Hurghada to the Sudanese border.
GEOFABRIK=africa/egypt
BBOX="32.2 21.9 36.95 30.0"
SITES_BBOX="32.2 21.9 36.95 30.0"
AGENCIES=""
REGION_LANG=en
