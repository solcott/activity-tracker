name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # kmp-dataresult comes from GitHub Packages, which wants a token even for public reads (settings.gradle.kts).
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Public-safety check
        run: scripts/check-public-safety.sh

      # The build (Android SDK pieces, Gradle cache, Kotlin/Native toolchain, every module's outputs) outgrows the runner's
      # free disk. These preinstalled toolchains aren't used; the Android SDK stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties sizes the heaps for a developer machine. With lint and the test JVMs on top they ran an 8 GB runner
      # out of memory, so CI gets smaller heaps and fewer parallel workers. User-home properties override the project's.
      # Linux can't run the iOS tests, so CI doesn't cross-compile the iOS klibs either.
      - name: Size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=2
          kotlin.native.enableKlibsCrossCompilation=false
          EOF
          free -m

      # On Linux, Kotlin/Native skips the Apple targets, so this runs the JVM, Android and server tests and every static
      # check. The screenshot suite is left out: its references are layoutlib renders from macOS, and Linux rasterises
      # fonts differently.
      - name: Check
        run: ./gradlew check -x :androidApp:testDebugScreenshotTestDefaultTestSuite --continue
