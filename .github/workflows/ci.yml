name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read # ci-last-built.sh reads earlier runs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push, including docs-only ones: the public-safety check looks at openspec/ and docs most of all. It also
  # decides whether the build below is needed.
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Public-safety check
        run: scripts/check-public-safety.sh

      # A push compares against the last commit on its branch whose build passed, not the previous push, which may have
      # failed, been cancelled or skipped its own build. With no such commit the base is empty, and the build runs.
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base=$(scripts/ci-last-built.sh "$GITHUB_REF_NAME")
          fi
          echo "base=$base"
          echo "code=$(scripts/ci-code-changed.sh "$base" "$GITHUB_SHA")" | tee -a "$GITHUB_OUTPUT"

  # Skipped when only docs, openspec/ or agent configuration changed. A job skipped by `if` reports success.
  check:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The build (Android SDK pieces, Gradle cache, Kotlin/Native toolchain, every module's outputs) outgrows the runner's
      # free disk. These preinstalled toolchains aren't used; the Android SDK stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      # With the key, setup-gradle also saves and restores the configuration cache (it holds secrets' values, so it is only
      # cached encrypted), and a run whose build scripts didn't change skips configuration. Without the secret, as in a
      # fork's pull request, the step works as before.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # gradle.properties sizes the heaps for a developer machine. With lint and the test JVMs on top they ran an 8 GB runner
      # out of memory, so CI gets smaller heaps and fewer parallel workers. User-home properties override the project's.
      # The Kotlin daemon got 5 GB when check linked the web app's development and production executables at once, which
      # ran 3 GB out of heap on a cold build. check links only the development one now, so this may be more than it needs.
      # Linux can't run the iOS tests, so CI doesn't cross-compile the iOS klibs either.
      - name: Size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx5g
          org.gradle.workers.max=2
          kotlin.native.enableKlibsCrossCompilation=false
          EOF
          free -m

      # On Linux, Kotlin/Native skips the Apple targets, so this runs the JVM, Android and server tests and every static
      # check. The screenshot suite is left out: its references are layoutlib renders from macOS, and Linux rasterises
      # fonts differently.
      - name: Check
        run: ./gradlew check -x :androidApp:testDebugScreenshotTestDefaultTestSuite --continue
