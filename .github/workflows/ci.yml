name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read # ci-last-built.sh reads earlier runs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push, including docs-only ones: the public-safety check looks at openspec/ and docs most of all. It also
  # decides whether the build below is needed.
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Public-safety check
        run: scripts/check-public-safety.sh

      # A push compares against the last commit on its branch whose build passed, not the previous push, which may have
      # failed, been cancelled or skipped its own build. With no such commit the base is empty, and the build runs.
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base=$(scripts/ci-last-built.sh "$GITHUB_REF_NAME")
          fi
          echo "base=$base"
          echo "code=$(scripts/ci-code-changed.sh "$base" "$GITHUB_SHA")" | tee -a "$GITHUB_OUTPUT"

  # Skipped when only docs, openspec/ or agent configuration changed. A job skipped by `if` reports success.
  check:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The build (Android SDK pieces, Gradle cache, Kotlin/Native toolchain, every module's outputs) outgrows the runner's
      # free disk. These preinstalled toolchains aren't used; the Android SDK stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      # With the key, setup-gradle also saves and restores the configuration cache (it holds secrets' values, so it is only
      # cached encrypted), and a run whose build scripts didn't change skips configuration. Without the secret, as in a
      # fork's pull request, the step works as before.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # gradle.properties sizes the heaps for a developer machine. With lint and the test JVMs on top they ran an 8 GB runner
      # out of memory, so CI gets smaller heaps and fewer parallel workers. User-home properties override the project's.
      # The Kotlin daemon got 5 GB when check linked the web app's development and production executables at once, which
      # ran 3 GB out of heap on a cold build. check links only the development one now, so this may be more than it needs.
      # Linux can't run the iOS tests, so CI doesn't cross-compile the iOS klibs either.
      - name: Size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx5g
          org.gradle.workers.max=2
          kotlin.native.enableKlibsCrossCompilation=false
          EOF
          free -m

      # On Linux, Kotlin/Native skips the Apple targets, so this runs the JVM, Android and server tests and every static
      # check. The screenshot suite is left out: its references are layoutlib renders from macOS, and Linux rasterises
      # fonts differently.
      - name: Check
        run: ./gradlew check -x :androidApp:testDebugScreenshotTestDefaultTestSuite --continue

  # The iOS app, built for the simulator as a developer builds it (dev/ios-swift-interop). Nothing in `check` compiles iOS code, so this
  # is the only place a contract that no longer exports to Swift, a stub the stub check rejects or a broken Swift file fails. Beside
  # `check`, not after it, and skipped with it. It then runs the app's Swift unit tests on a simulator (ui/ios-native-shell).
  ios:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # As in `check`: gradle.properties sizes the heaps for a developer machine. Kotlin/Native compiles and links inside the Gradle
      # daemon, so the daemon keeps most of the runner's memory and the Kotlin daemon, which only the build logic uses here, little.
      - name: Size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          EOF
          sysctl -n hw.memsize hw.ncpu

      # Its build phase runs :iosExport:embedSwiftExportForXcode and :iosExport:checkSwiftExportStubs, then Xcode compiles the generated
      # Swift and the app's own. The ad-hoc signature needs no team and no secret.
      - name: Build the iOS app
        run: |
          xcodebuild -version
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY=- build

      # The app's Swift unit tests (Swift Testing, in iosApp/iosAppTests), on an iPhone simulator of the newest runtime the runner has
      # that the app supports. They run inside the app, so the app is signed as above.
      - name: Run the iOS app's Swift tests
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS-(1[89]|[2-9][0-9])")))
            | map(.value |= map(select(.name | startswith("iPhone"))))
            | map(select(.value | length > 0))
            | sort_by(.key) | last | .value[0].udid')
          echo "Simulator: $udid"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$udid" CODE_SIGN_IDENTITY=- test
