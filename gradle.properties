# IDE sync resolves every module's intermediate source sets (commonJvm, nonWeb, nonApple, …) and needs more than 8g.
# An org.gradle.jvmargs in ~/.gradle/gradle.properties overrides this line.
org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# build-logic/gradle.properties repeats this line: without it that build's Kotlin daemon inherits the Gradle daemon's 12g, as a second daemon.
kotlin.daemon.jvmargs=-Xmx4g
kotlin.mpp.enableCInteropCommonization=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose Preview Screenshot Testing as an AGP test suite (androidApp's screenshotTest).
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true

# Metro generates Circuit Presenter/Ui factories for @CircuitInject (no Circuit KSP processor).
metro.enableCircuitCodegen=true

# No parallel IDE sync: KGP's rootPackageJson configures every project's npm-dependent tasks (wasmJsNodeTest, …) from the root, which
# races each project's own sync and fails it with a ConcurrentModificationException. Serial sync also lowers its peak heap.
org.gradle.tooling.parallel=false

# Compose Hot Reload (auto-applied by the Compose Multiplatform plugin) needs a JetBrains Runtime; fetch one via foojay on first hotRun.
compose.reload.jbr.autoProvisioningEnabled=true
