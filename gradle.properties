org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g
kotlin.mpp.enableCInteropCommonization=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Metro generates Circuit Presenter/Ui factories for @CircuitInject (no Circuit KSP processor).
metro.enableCircuitCodegen=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Compose Hot Reload (auto-applied by the Compose Multiplatform plugin) needs a JetBrains Runtime; fetch one via foojay on first hotRun.
compose.reload.jbr.autoProvisioningEnabled=true
