[versions]
# Toolchain. Circuit 0.39 requires Kotlin 2.4.20 / Compose Multiplatform 1.12.x; Metro 1.4.5 supports this Kotlin.
kotlin = "2.4.21"
# JDK used for every compile/test/run toolchain (Amazon Corretto, provisioned via foojay).
#noinspection UnusedVersionCatalogEntry
jdk = "25"
agp = "9.4.1"
ksp = "2.3.12"
composeMultiplatform = "1.12.1"
metro = "1.4.5"
detekt = "2.0.0-alpha.6"
composeRules = "0.6.7"
ktfmt = "0.27.0"
sortDependencies = "0.21.0"

#noinspection UnusedVersionCatalogEntry
android-compileSdk = "37"

#noinspection UnusedVersionCatalogEntry
android-minSdk = "26"
#noinspection UnusedVersionCatalogEntry
android-targetSdk = "37"

circuit = "0.39.0"
# Adaptive (UIKit on iOS, Material elsewhere) dialogs, sheets, pickers, menus and the tab bar. Pinned to our Kotlin/CMP pair.
calf = "0.14.0"
coil = "3.6.3"
# Backdrop blur for the Compose-drawn iOS navigation bar (Compose can only blur its own content, not what's behind it).
haze = "2.0.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
ktor = "3.6.0"
room = "3.0.3"
androidx-sqlite = "2.7.1"
cryptography = "0.6.0"
material3 = "1.12.0-alpha03"
materialIcons = "1.7.3"
kotlinxBrowser = "0.5.0"
kermit = "2.2.0"
kotlinxCollectionsImmutable = "0.5.2"
kotlinxDatetime = "0.8.0"
# kotlinx-datetime's zone rules on web (npm). 2.22 is the last that accepts the @js-joda/core 3.x kotlinx-datetime pulls in.
#noinspection UnusedVersionCatalogEntry
jsJodaTimezone = "2.22.0"
kotlinxIo = "0.9.1"
maplibreCompose = "0.19.0"
filekit = "0.16.0"
# Garmin FIT SDK: the Java artifact (Maven) and the JS package (npm) share this version.
garminFit = "21.218.0"
xmlutil = "1.0.2.1"
# androidx artifact that Compose Multiplatform's runtime already resolves to; @Immutable/@Stable for modules without Compose.
composeRuntimeAnnotation = "1.12.1"

androidx-activity = "1.13.0"
androidx-browser = "1.10.0"
androidx-core = "1.19.1"
playServicesLocation = "21.4.0"

# Server
exposed = "1.5.0"
flyway = "13.10.0"
postgresql = "42.7.14"
hikari = "7.1.0"
logback = "1.6.5"
bouncycastle = "1.86"
h2 = "2.5.252"

turbine = "1.2.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinxIo" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kermit-ktor = { module = "co.touchlab:kermit-ktor", version.ref = "kermit" }
kermit-test = { module = "co.touchlab:kermit-test", version.ref = "kermit" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-engine-defaults = { module = "io.ktor:ktor-client-engine-defaults", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

circuit-foundation = { module = "com.slack.circuit:circuit-foundation", version.ref = "circuit" }
circuit-runtime = { module = "com.slack.circuit:circuit-runtime", version.ref = "circuit" }
circuit-runtime-presenter = { module = "com.slack.circuit:circuit-runtime-presenter", version.ref = "circuit" }
circuit-serialization = { module = "com.slack.circuit:circuit-serialization", version.ref = "circuit" }
circuit-codegen-annotations = { module = "com.slack.circuit:circuit-codegen-annotations", version.ref = "circuit" }
circuit-test = { module = "com.slack.circuit:circuit-test", version.ref = "circuit" }
circuitx-gesture-navigation = { module = "com.slack.circuit:circuitx-gesture-navigation", version.ref = "circuit" }
calf-ui = { module = "com.mohamedrejeb.calf:calf-ui", version.ref = "calf" }
calf-cupertino-icons = { module = "com.mohamedrejeb.calf:calf-cupertino-icons", version.ref = "calf" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-runtime-annotation = { module = "androidx.compose.runtime:runtime-annotation", version.ref = "composeRuntimeAnnotation" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
#noinspection UnusedVersionCatalogEntry
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIcons" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibreCompose" }
maplibre-compose-runtime-opengl-android = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibreCompose" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
garmin-fit = { module = "com.garmin:fit", version.ref = "garminFit" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
