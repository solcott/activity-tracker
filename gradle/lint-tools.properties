# The linters and formatters `activitytracker.lint` runs on what isn't Kotlin (LintConventionPlugin.kt). Each is pinned to one release,
# fetched once per machine into the Gradle user home and checked against its SHA-256 before it runs, so local runs and CI agree.
#
# Keys: <tool>.<os>-<arch>.url, .sha256, and .entry, the binary's path inside the download (left out when the download is the binary,
# or one gzipped file). The OS is darwin or linux and the arch arm64 or x64. To bump a tool, change its URLs, take each asset's sha256
# from `gh api repos/<owner>/<repo>/releases/tags/<tag> --jq '.assets[] | .name + " " + .digest'` (or `shasum -a 256` of the download
# when a release lists none, as taplo's don't), and run `./gradlew lintNonKotlin`.
#
# swift-format isn't here: it ships with Xcode (`xcrun swift-format`), so it follows the Xcode version, as Swift itself does.

# SwiftLint 0.65.1 (realm/SwiftLint). Only on macOS: the Swift tasks run only there. The portable zip holds one universal binary.
swiftlint.darwin-arm64.url=https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
swiftlint.darwin-arm64.sha256=c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
swiftlint.darwin-arm64.entry=swiftlint
swiftlint.darwin-x64.url=https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
swiftlint.darwin-x64.sha256=c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
swiftlint.darwin-x64.entry=swiftlint

