// Types we don't own that the Compose compiler can't infer as stable, one fully qualified name (or glob) per line.
// Classes we own get @Immutable or @Stable instead. Wired in by activitytracker.quality; ./gradlew composeStabilityCheck enforces.
// kotlin.time.Duration is inferred stable, and Instant only appears inside @Immutable lexicon models.

// Immutable bytes, for image data in State and events. Never use a ByteArray there.
kotlinx.io.bytestring.ByteString

// Vico's chart data, built once from a State's list and never mutated (StaticChart).
com.patrykandpatrick.vico.multiplatform.cartesian.data.CartesianChartModel

// A calendar date value, for feed filter date ranges.
kotlinx.datetime.LocalDate
