# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Existing findings live in each module's detekt-baseline.xml; regenerate with ./gradlew detektBaseline.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 140 # matches ktfmt maxWidth
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

Compose:
  ComposableNaming:
    active: true
    # Circuit presenter functions are PascalCase by convention.
    allowedComposableFunctionNames: '.*Presenter'
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
