# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Any findings that can't be fixed live in that module's detekt-baseline.xml; regenerate with ./gradlew detektBaseline.

naming:
  MatchingDeclarationName:
    # Platform-suffixed actual files (Foo.wasmJs.kt); the default list predates the wasm and web targets.
    multiplatformTargets: ['ios', 'android', 'js', 'jvm', 'native', 'wasmJs', 'web', 'apple']
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  CyclomaticComplexMethod:
    # A when that maps each enum entry to one value (UiError.Kind -> its string) adds no real branching.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 140 # matches ktfmt maxWidth
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

Compose:
  ComposableNaming:
    active: true
    # Circuit presenter functions are PascalCase by convention.
    ignoreAnnotated: ['CircuitInject', 'SubCircuitInject']
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The unit preference is ambient like the theme: every stat formatter reads it, so threading it through each State would add noise.
    allowedCompositionLocals: LocalUnitSystem
  # Composable params take ImmutableList, not List; composeStabilityCheck catches the rest from the compiler reports.
  UnstableCollections:
    active: true

config:
  # :detekt-rules's own detekt run doesn't load that module's rules, so it can't validate their config.
  excludes: ['activitytracker.*']

# The repo's own rules, from :detekt-rules.
activitytracker:
  # Text fields take a TextFieldState, not value + onValueChange.
  UseTextFieldState:
    active: true
