# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Any findings that can't be fixed live in that module's detekt-baseline.xml; regenerate with ./gradlew detektBaseline.

naming:
  MatchingDeclarationName:
    # Platform-suffixed actual files (Foo.wasmJs.kt); the default list predates the wasm and web targets.
    multiplatformTargets: ['ios', 'android', 'js', 'jvm', 'native', 'wasmJs', 'web', 'apple']
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  CyclomaticComplexMethod:
    # A when that maps each enum entry to one value (UiError.Kind -> its string) adds no real branching.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 140 # matches ktfmt maxWidth
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

Compose:
  ComposableNaming:
    active: true
    # Circuit presenter functions are PascalCase by convention.
    ignoreAnnotated: ['CircuitInject', 'SubCircuitInject']
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The unit preference is ambient like the theme: every stat formatter reads it, so threading it through each State would add noise.
    # LocalUiPlatform and LocalIosColors are part of the theme, and LocalIsNavRoot is navigation state App provides to every screen's top bar.
    # LocalFloatingBottomBarHeight is AppShell's floating iOS tab bar, which every screen's AppScaffold pads for, and LocalBarBackdrop is
    # the content AppScaffold hands its iOS top bar to blur. LocalPinnedOverContent tells the checkboxes in a sticky header to put their
    # native iOS view over the Compose canvas, so rows scrolling under can't show through; threading it through every trailing slot would
    # leak a UIKit layering detail into each picker. LocalTopBarEdge is where AppScaffold's iOS top bar ends, which native views over the
    # canvas read to hide under it, for the same reason. LocalIsPaneRoot and LocalSettingsPane are navigation state too: the list-detail
    # decoration tells a detail pane's first page to drop its back button, and the Settings list which page shows beside it.
    allowedCompositionLocals: LocalUnitSystem,LocalClock,LocalTimeZone,LocalHourClock,LocalUiPlatform,LocalIosColors,LocalIsNavRoot,LocalIsPaneRoot,LocalSettingsPane,LocalFloatingBottomBarHeight,LocalBarBackdrop,LocalPinnedOverContent,LocalTopBarEdge
  # Composable params take ImmutableList, not List; composeStabilityCheck catches the rest from the compiler reports.
  UnstableCollections:
    active: true

config:
  # :detekt-rules's own detekt run doesn't load that module's rules, so it can't validate their config.
  excludes: ['activitytracker.*']

# The repo's own rules, from :detekt-rules.
activitytracker:
  # Text fields take a TextFieldState, not value + onValueChange.
  UseTextFieldState:
    active: true
  # That state is the app's TextFieldState (:core-textfield), which Swift export can carry, not Compose's of the same name.
  UseAppTextFieldState:
    active: true
  # Presenters launch event work through rememberSingleFlight(), so a double tap can't run it twice.
  UseSingleFlight:
    active: true
  # Screens use app.ui.adaptive's components (AppTopBar, AppButton…), which follow each platform, not the Material widgets they wrap.
  UseAdaptiveComponents:
    active: true
  # UIs (*Ui.kt) read LocalClock and LocalTimeZone, not the system clock or time zone, so previews and tests can fix them.
  NoSystemClockInUi:
    active: true
  # Pair and Triple stay out of non-private signatures: a data class names what the values are, and Swift export can bridge it.
  NoPairInApi:
    active: true
